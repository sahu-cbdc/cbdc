<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087a4b">
  <title>অ্যাডমিন প্যানেল — চকবাজার ব্লাড ডোনার'স ক্লাব</title>
  <script>
(function(){
  /* UI সর্বদা Light version — System (Dark/Light) অনুযায়ী auto theme বন্ধ।
     Theme পরিবর্তনের ম্যানুয়াল অপশন এ প্যানেলের সেটিংসে আছে। */
  document.documentElement.dataset.theme = "light";
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = "#087a4b";
})();
</script>
  <link rel="stylesheet" href="https://fonts.maateen.me/solaiman-lipi/font.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main-admin.tsx"></script>
</body>
</html>
